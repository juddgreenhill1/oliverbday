<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday Dad!</title>
<style>
  :root {
    --red: #7a0f1f;
    --red-dark: #4a0812;
    --gold: #e9c46a;
    --cream: #fff6e0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: radial-gradient(circle at 50% 0%, var(--red) 0%, var(--red-dark) 80%);
    color: var(--cream);
    text-align: center;
    padding: 32px 16px 48px;
    overflow-x: hidden;
  }
  canvas#confetti {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }
  h1 {
    font-size: clamp(2.2rem, 10vw, 3.6rem);
    margin: 8px 0 4px;
    color: var(--gold);
    text-shadow: 0 2px 0 rgba(0,0,0,.35);
    animation: pop .8s ease-out both;
  }
  .sub { font-size: 1.15rem; margin: 0 0 28px; opacity: .95; animation: pop .8s .2s ease-out both; }
  .ticket {
    max-width: 380px; margin: 0 auto;
    background: var(--cream); color: #2b1a10;
    border-radius: 14px; padding: 26px 22px 22px;
    position: relative;
    box-shadow: 0 14px 40px rgba(0,0,0,.45);
    border: 3px dashed var(--red);
    animation: pop .9s .4s ease-out both;
  }
  .ticket::before, .ticket::after {
    content: ""; position: absolute; top: 58%;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--red-dark);
  }
  .ticket::before { left: -15px; }
  .ticket::after { right: -15px; }
  .admit { letter-spacing: .25em; font-size: .75rem; color: var(--red); text-transform: uppercase; }
  .show { font-size: 2.6rem; font-weight: bold; margin: 6px 0 0; color: var(--red); font-style: italic; }
  .musical { font-size: 1rem; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 16px; }
  .divider { border-top: 2px dashed rgba(122,15,31,.4); margin: 18px 0; }
  .who { font-size: 1.35rem; font-weight: bold; }
  .where { margin-top: 6px; font-size: 1rem; }
  .tbc { margin-top: 14px; font-size: .95rem; font-style: italic; color: #6b4a3a; }
  .msg { max-width: 380px; margin: 28px auto 0; font-size: 1.1rem; line-height: 1.5; animation: pop .9s .7s ease-out both; }
  button {
    margin-top: 26px; font: inherit; font-size: 1rem;
    background: var(--gold); color: var(--red-dark);
    border: 0; border-radius: 999px; padding: 12px 26px; cursor: pointer;
    font-weight: bold; animation: pop .9s .9s ease-out both;
  }
  button:active { transform: scale(.96); }
  @keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.96); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<h1>Happy Birthday Dad! 🎉</h1>
<p class="sub">You've got a ticket…</p>

<div class="ticket">
  <div class="admit">Admit Dad + Family</div>
  <div class="show">Oliver!</div>
  <div class="musical">The Musical</div>
  <div class="divider"></div>
  <div class="who">🎟️ Your birthday present</div>
  <div class="where">Johannesburg</div>
  <div class="tbc">Date to be announced — we'll tell you soon!</div>
</div>

<p class="msg">
  Mom has got you tickets to see <strong>Oliver!</strong> for your birthday.<br>
  We're all coming with you. 🎭<br><br>
  Love you lots ❤️
</p>

<button id="again">More confetti! 🎊</button>

<script>
(function () {
  var canvas = document.getElementById('confetti');
  var ctx = canvas.getContext('2d');
  var colors = ['#e9c46a', '#e63946', '#ffffff', '#f4a261', '#2a9d8f', '#ff8fab'];
  var pieces = [];
  var running = false;

  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  addEventListener('resize', resize);
  resize();

  function burst(count) {
    for (var i = 0; i < count; i++) {
      pieces.push({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.6,
        w: 6 + Math.random() * 8,
        h: 8 + Math.random() * 10,
        vx: -1.5 + Math.random() * 3,
        vy: 2 + Math.random() * 4,
        rot: Math.random() * Math.PI,
        vr: -0.2 + Math.random() * 0.4,
        c: colors[(Math.random() * colors.length) | 0]
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }

  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces = pieces.filter(function (p) { return p.y < canvas.height + 30; });
    pieces.forEach(function (p) {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (pieces.length) requestAnimationFrame(tick); else running = false;
  }

  burst(220);
  setTimeout(function () { burst(120); }, 1200);
  document.getElementById('again').addEventListener('click', function () { burst(250); });
})();
</script>
</body>
</html>
